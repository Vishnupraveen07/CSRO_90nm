[average]
Signal=VT(\"/I13/Vosc\")
continuous=yes

[compare]
Absolute%20Tolerance=0.0
Relative%20Tolerance=0.0
Signal1=freq(v(\"/Vctrl\" ?result \"tran\") \"rising\" ?xName \"time\" ?mode \"auto\" ?threshold 0.5)
Signal2=freq(v(\"/Vctrl\" ?result \"tran\") \"rising\" ?xName \"time\" ?mode \"auto\" ?threshold 0.5)

[delay]
Edge%20Number%201=1
Edge%20Number%202=1
Edge%20Type%201=rising
Edge%20Type%202=falling
Number%20of%20occurrences=single
Periodicity%201=1
Periodicity%202=1
Plot\print%20vs.=trigger
Signal1=v(\"/Vctrl\" ?result \"tran\")
Signal2=v(\"/Vosc\" ?result \"tran\")
Start%201=0.0
Start%202=nil
Start%202%20relative%20to=trigger
Stop=nil
Threshold%20Value%201=0.9
Threshold%20Value%202=0.9
Tolerance%201=nil
Tolerance%202=nil

[freq]
Edge%20Type=rising
Plot%20vs.=cycle
Signal=VT(\"/Vosc\")
Threshold%20Mode=auto
User%20Threshold%20Value=0.5

[pavg]
From=
Period=
Sampling%20Factor=1
Signal=average(VT(\"/I13/Vosc\") )
To=

[value]
Extrapolate=on
Interpolate%20at=0
Interpolation%20method=linear
Number%20of%20occurrences=single
Period%20%28required%20for%20multiple%29=
Plot\print%20vs.=time
Signal=freq(v(\"/Vctrl\" ?result \"tran\") \"rising\" ?xName \"time\" ?mode \"auto\" ?threshold 0.5)

[waveVsWave]
Select%20xTrace=VS(\"/Vctrl\")
Select%20yTrace=freq(v(\"/Vosc\" ?result \"tran\") \"rising\" ?xName \"time\" ?mode \"auto\" ?threshold 0.0)
